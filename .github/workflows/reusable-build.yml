name: Reusable .NET Build1

on:
  workflow_call:
    inputs:
      environment:
        required: false
        type: string
        default: Development
    secrets:
      SERVER_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    

    steps:

      - name: Show Environment
        run: 'echo "Environment: ${{ inputs.environment }}"'

      - name: Verify Server Password
        env:
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
            if [ -n "$SERVER_PASSWORD" ]; then
             echo "Server password is configured."
             else
            echo "Server password is missing."
             exit 1
             fi
        
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --configuration Release

      - name: Run tests
        run: dotnet test --configuration Release
