
name: Reusable .NET Build

on:
  workflow_call:
    inputs:
      environment:
        required: false
        type: string
        default: Development

    secrets:
      SERVER_PASSWORD:
        required: true

    outputs:
      build-status:
        description: "Build status"
        value: ${{ jobs.build.outputs.build_status }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      build_status: ${{ steps.build_result.outputs.status }}

    steps:
      - name: Show Environment
        run: 'echo "Environment: ${{ inputs.environment }}"'

      - name: Verify Server Password
        env:
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          if [ -n "$SERVER_PASSWORD" ]; then
            echo "Server password is configured."
          else
            echo "Server password is missing."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --configuration Release

      - name: Run tests
        run: dotnet test --configuration Release

      - name: Set Build Status
        id: build_result
        run: echo "status=Build Successful" >> "$GITHUB_OUTPUT"
