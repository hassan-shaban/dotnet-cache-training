
name: Matrix Control Training

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        version: [1, 2, 3, 4, 5]

    steps:
      - name: Show Job Number
        run: echo "Running Matrix Job ${{ matrix.version }}"

      - name: Simulate Test
        run: sleep 10
