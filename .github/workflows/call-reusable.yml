name: Call Reusable Workflow

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  call-build:
    uses: ./.github/workflows/reusable-build.yml
    secrets:
      SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}

  show-result:
    needs: call-build
    runs-on: ubuntu-latest
    steps:
      - name: Show Build Status
        run: 'echo "Reusable Workflow Result: ${{ needs.call-build.outputs.build-status }}"'